<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pivotick Graph Transformer — Demo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="site-header">
      <div class="brand-block">
        <span class="brand">
          <span class="brand-mark">Pivotick</span>
          <span class="brand-suffix">Graph Transformer</span>
        </span>
        <p class="tagline">Pick a converter, load a fixture, preview the render.</p>
      </div>
      <button id="theme-toggle" type="button" aria-label="Toggle color theme"></button>
    </header>

    <main>
      <form id="controls">
        <label>
          Format
          <select id="format-select"></select>
        </label>

        <label>
          Variant
          <select id="variant-select"></select>
        </label>

        <label>
          Fixture
          <select id="fixture-select"></select>
        </label>

        <button type="submit" id="render-btn">Render</button>
      </form>

      <p id="status" role="status"></p>

      <div id="pivotick-container"></div>

      <details id="output-details" open>
        <summary>Converted output <span id="output-summary-meta"></span></summary>
        <div id="json-output"></div>
      </details>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
