<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pivotick Graph Transformer — Demo</title>
    <link rel="icon" type="image/svg+xml" href="./vendor/pivotick/logo.svg" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="site-nav">
      <a class="brand" href="https://github.com/ecrou-exact/pivotick-graph-transformer">
        <img src="./vendor/pivotick/logo.svg" alt="" class="brand-logo" />
        <span class="brand-text">
          <span class="brand-name">Pivotick</span>
          <span class="brand-suffix">Graph Transformer</span>
        </span>
      </a>

      <nav class="nav-links" aria-label="Main">
        <a href="https://pivotick.github.io/Pivotick/" target="_blank" rel="noopener noreferrer">Docs</a>
        <a href="#" class="active" aria-current="page">Demo</a>
        <a href="https://github.com/ecrou-exact/pivotick-graph-transformer" target="_blank" rel="noopener noreferrer" class="icon-link" aria-label="GitHub repository">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.98 5.24.98 11.52c0 5.03 3.26 9.29 7.79 10.8.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.17.69-3.84-1.36-3.84-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96.1-.74.4-1.25.72-1.54-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.17.91-.25 1.89-.38 2.86-.39.97.01 1.95.14 2.86.39 2.18-1.48 3.14-1.17 3.14-1.17.62 1.57.23 2.73.11 3.02.73.8 1.17 1.82 1.17 3.06 0 4.37-2.66 5.34-5.2 5.62.41.36.77 1.07.77 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55A11.03 11.03 0 0 0 23.02 11.5C23.02 5.24 18.27.5 12 .5z" /></svg>
        </a>
        <button id="theme-toggle" type="button" aria-label="Toggle color theme"></button>
      </nav>
    </header>

    <main>
      <form id="controls">
        <label>
          Format
          <select id="format-select"></select>
        </label>

        <label>
          Variant
          <select id="variant-select"></select>
        </label>

        <label>
          Fixture
          <select id="fixture-select"></select>
        </label>

        <button type="submit" id="render-btn">Render</button>

        <div id="dropzone" tabindex="0" role="button" aria-label="Drop a JSON file, or click to browse">
          <span>Drop a JSON file, or <span class="dropzone-browse">browse</span></span>
          <input type="file" id="file-input" accept="application/json,.json" hidden />
        </div>
      </form>

      <p id="status" role="status"></p>

      <div id="workspace">
        <div id="pivotick-container"></div>

        <section id="output-panel" aria-label="Converted output">
          <div id="output-header">
            <h2>Converted output</h2>
            <span id="output-summary-meta"></span>
          </div>
          <div id="json-output"></div>
        </section>
      </div>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
